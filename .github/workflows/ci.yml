name: CI

# First automated gate for the monorepo. Two independent halves of the product,
# two jobs:
#   - harness: the Python control plane (stdlib unittest; no network, no API key)
#   - cockpit: the Node dashboard (prettier + server/client vitest suites)
# Both run on every push and PR. The commands mirror what the repo's own npm
# scripts run locally, so a green checkout stays green here.

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref so a fast follow-up push doesn't queue
# behind a stale one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Node is needed for the cross-language schema-version parity check
      # (test_contract.py shells out to read the JS-exported contract versions
      # and asserts they equal the Python-resolved values — fail-closed on a
      # one-sided change). The other Python tests don't need it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime deps
        run: python -m pip install --upgrade pip pyyaml jsonschema
      - name: Core + CLI tests
        # The `tests` package and the SDK's `sdk.python.tests` package share the
        # name `tests`, so they must be discovered in two separate invocations.
        run: python -m unittest tests.test_cli tests.test_gates tests.test_model_tiers tests.test_contract
      - name: Schema-version cross-language parity
        # Explicit gate (council MED #7): JS SCHEMA_VERSION / APPROVAL_SCHEMA_VERSION
        # must equal the Python-resolved values, both derived from the single
        # canonical packages/contracts/schema-version.json. Reds on drift.
        run: python -m unittest tests.test_contract.TestSchemaVersionParity
      - name: SDK orchestrator tests
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/harness/harness_core:${{ github.workspace }}/packages/harness/sdk/python
        run: python -m unittest sdk.python.tests.test_sdk sdk.python.tests.test_claude_driver

  cockpit:
    name: cockpit (Node)
    runs-on: ubuntu-latest
    # Skip husky's git-hook install in CI (the `prepare` lifecycle script).
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # server/ and client/ are intentionally NOT npm workspaces — the cockpit
      # manages them via cd scripts — so each is installed on its own.
      - name: Install cockpit (lint tooling + workspaces)
        working-directory: apps/cockpit
        run: npm ci
      - name: Install server deps
        working-directory: apps/cockpit/server
        run: npm ci
      - name: Install client deps
        working-directory: apps/cockpit/client
        run: npm ci
      # Root workspace install, LAST. This creates the
      # node_modules/@mission-control/contracts symlink that the server suite
      # imports (`@mission-control/contracts`) — without it the contract test
      # fails with ERR_MODULE_NOT_FOUND in CI even though it passes locally,
      # where a root `npm install` has already linked the workspace. It must run
      # AFTER the apps/cockpit install above: a `npm ci` inside the apps/cockpit
      # workspace member prunes this root symlink, so installing the root last
      # is what keeps it intact for the test steps. The root lock
      # (mission-control) covers the apps/cockpit + packages/contracts
      # workspaces only.
      - name: Install root workspaces (links @mission-control/contracts)
        run: npm ci
      - name: Lint (prettier --check)
        working-directory: apps/cockpit
        run: npm run lint
      - name: Server tests
        working-directory: apps/cockpit/server
        run: npx vitest run
      - name: Client tests
        working-directory: apps/cockpit/client
        run: npx vitest run

  # GATED end-to-end lane (council HIGH #3). Its own job so the fast unit lane
  # above stays untouched. Two parts:
  #   - the real-subprocess Fleet vitest e2e (a deterministic stub `claude` bin
  #     drives a full verify→reject→informed-retry→synthesis cycle and asserts a
  #     known-bad diff is REJECTED). The companion durability case is the 1g
  #     acceptance test, written it.fails until the boot reconciler lands.
  #   - the (previously orphaned) Playwright browser suite, wired in here.
  e2e:
    name: cockpit e2e (Fleet + Playwright)
    runs-on: ubuntu-latest
    needs: cockpit
    # Fail fast instead of hanging for hours: the Playwright lane spawns its own
    # server+client and runs 1-worker with retries, so a regression that breaks
    # app rendering makes every test burn its full 60s timeout x3. A green run
    # is ~5-6 min; 20 leaves generous headroom while capping a stuck run.
    timeout-minutes: 20
    env:
      HUSKY: 0
      RUN_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install cockpit (root tooling + Playwright)
        working-directory: apps/cockpit
        run: npm ci
      - name: Install server deps
        working-directory: apps/cockpit/server
        run: npm ci
      - name: Install client deps
        working-directory: apps/cockpit/client
        run: npm ci
      # Root workspace install, LAST — same reason as the cockpit job: it links
      # node_modules/@mission-control/contracts (imported transitively by the
      # server e2e) and must run after the apps/cockpit install, which would
      # otherwise prune the symlink.
      - name: Install root workspaces (links @mission-control/contracts)
        run: npm ci
      # The Fleet e2e spawns a real (stub) subprocess in a temp git repo.
      - name: Fleet e2e (real-subprocess reject/retry lane)
        working-directory: apps/cockpit/server
        run: npx vitest run --config vitest.e2e.config.js
      - name: Install Playwright browsers
        working-directory: apps/cockpit
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e
        working-directory: apps/cockpit
        run: npx playwright test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/cockpit/playwright-report
          retention-days: 7
