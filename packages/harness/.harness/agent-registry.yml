# Agent registry — maps agent role names referenced in pipelines/*.yml to
# concrete files on disk. `tools/harness check` uses this for validation.
#
# Resolution order, highest priority first:
#   1. Explicit alias in `aliases:` below (e.g. for cross-tool naming differences)
#   2. agents/roles/<name>.md (the cross-tool, adapter-neutral role definition)
#   3. adapters/claude-code/.claude/agents/<name>.md (Claude Code subagent)
#
# If none of those resolve, `harness check` warns (or fails under --strict).
#
# Add an alias when a pipeline references a name that doesn't match a file on
# disk under the default rules. The most common case: when the Claude Code
# adapter uses a `harness-` prefix and a pipeline references the bare name.

aliases:
  # Examples (uncomment / extend as needed):
  #
  # If a pipeline says `agent: orchestrator` and you want it to resolve to
  # the Claude Code subagent file too:
  #   orchestrator: adapters/claude-code/.claude/agents/harness-orchestrator.md
  #
  # If a pipeline references a custom team-specific agent:
  #   gss-cobol-tester: agents/roles/tester.md
  {}

# Default model tier per agent role (model-tier routing).
#
# Values are tier ALIASES defined in .harness/model-tiers.yml (heavy/standard/
# light), NOT literal model strings — keep concrete model names in that file so
# they remap in one place across tools. A phase's own `model:` overrides these;
# a role not listed here falls through to `default_tier` / the configured
# default. Unset = today's single-model behavior.
role_tiers:
  orchestrator: heavy
  architect: heavy
  prd-writer: heavy
  product-analyst: standard
  spec-writer: standard
  mission-planner: standard
  intake: standard
  reviewer: standard
  tester: standard
  implementer: standard
  repo-analyzer: light
  researcher: light
  session-memory: light

# Notes:
# - Aliases are file paths relative to the harness root.
# - Aliases override default resolution — use sparingly to avoid hiding what
#   actually runs.
# - When adding a new agent name to a pipeline, prefer creating
#   agents/roles/<name>.md first (no alias needed).
