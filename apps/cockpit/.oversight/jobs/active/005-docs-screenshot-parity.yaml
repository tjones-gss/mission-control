id: 005-docs-screenshot-parity
title: 'Verify docs + screenshot references are parity-clean'
domain: docs
priority: low

editable_paths:
  - README.md

# This is an audit-only job. No change_command; runs the docs sanity check
# in --oneshot mode. Establishes that all npm-script and file references in
# README resolve. Future agents can promote this to a repair job.
parallelizable: true

evaluators:
  sanity: 'python .oversight/scripts/check_docs_sanity.py'
  code_health: 'python .oversight/scripts/eval_code_health.py'

goal: |
  Confirm every `npm run <x>` reference in README.md corresponds to a real
  script in package.json, that image references resolve, and that there is
  no broken relative link. No code changes expected this wave.

rationale: |
  Docs drift is silent corrosion. Running the parity check often enough
  that agents see it as a first-class signal prevents docs rot.

budget:
  attempts: 1
  wall_clock_minutes: 3

success_criteria:
  - 'check_docs_sanity.py exits 0'

rollback_policy: |
  N/A — audit-only. If the sanity check fails, a follow-up `docs_sync` job
  should be scheduled (copy .oversight/jobs/templates/docs_sync.yaml).
